{% extends 'base.html' %}

{% block title %}
    list
{% endblock %}

{% block main %}
    <h1>📚 File List page</h1>

    <a href="{% url 'files_create' %}">
        <button class="btn btn-primary">create</button>
    </a>
    <div class="books">
        {% for file in files %}
            <div class="book-card">
                <h2>{{ file.title }}</h2>
                <p>{{ file.content }}</p>
                <img src="{{ file.img.url }}" alt="no photo"> <br> <br>
                {% if file.video %}
                    <video width="400" controls>
                        <source src="{{ file.video.url }}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                {% endif %}
                <a href="{{ file.file.url }}">file</a> <br> <br>

                <a href="{% url 'files_update' file.id %}">
                    <button class="btn btn-warning">update</button>
                </a>
            </div>
        {% endfor %}
    </div>

{% endblock %}
